<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>JS learning</title>
</head>

<body>
    <h1 id="FirstHeader">Welcome to My JS Learning Page</h1>
    <p id="firstP">Here I'll be creating multiple projects that involve JS to learn from</p>

    <div id="Test">
        <div id="TestBtnDiv">
            <button id="TestButton">Click Me</button>
            <div id="TestCircleDiv"></div>
        </div>    
    </div>
    
    

    <div id="CalculatorContainer">
        <div id="CalculatorBackground">
            <div>
                <input type="text" id="CalculatorScreen" value="0" disabled>
            </div>

            <div id="CalculatorButtons">
                <button class="Calc-Btn" data-action="clear">C</button>
                <button class="Calc-Btn" data-action="delete">DEL</button>
                <button class="Calc-Btn" data-undefined="%">%</button>
                <button class="Calc-Btn" data-value="/">/</button>

                <button class="Calc-Btn" data-value="7">7</button>
                <button class="Calc-Btn" data-value="8">8</button>
                <button class="Calc-Btn" data-value="9">9</button>

                <button class="Calc-Btn" data-value="*">*</button>

                <button class="Calc-Btn" data-value="4">4</button>
                <button class="Calc-Btn" data-value="5">5</button>
                <button class="Calc-Btn" data-value="6">6</button>

                <button class="Calc-Btn" data-value="-">-</button>

                <button class="Calc-Btn" data-value="1">1</button>
                <button class="Calc-Btn" data-value="2">2</button>
                <button class="Calc-Btn" data-value="3">3</button>

                <button class="Calc-Btn" data-value="+">+</button>

                <button class="Calc-Btn" data-value=".">.</button>
                <button class="Calc-Btn" data-value="0">0</button>

                <button class="Calc-Btn wide" data-action="calculate" style="background-color: orangered;">=</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
